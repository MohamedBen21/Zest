<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        font:
          13px "Segoe UI Variable",
          "Segoe UI",
          system-ui,
          sans-serif;
        color: #ececf0;
        overflow: hidden;
        user-select: none;
      }
      .card {
        position: absolute;
        inset: 8px;
        background: rgba(22, 22, 25, 0.98);
        border: 1px solid #2a2a31;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: in 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      @keyframes in {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
      }
      .hd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        font-weight: 700;
        border-bottom: 1px solid #2a2a31;
      }
      .hd img {
        width: 20px;
        height: 20px;
      }
      .hd .x {
        margin-inline-start: auto;
        border: 0;
        background: none;
        font-size: 15px;
        cursor: pointer;
        color: #999;
      }
      .list {
        overflow: auto;
        flex: 1;
        padding: 4px 0;
      }
      .job {
        padding: 6px 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 8px;
        align-items: center;
      }
      .job .n {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12.5px;
      }
      .job .st {
        font-size: 11.5px;
        color: #9a9aa6;
      }
      .bar {
        grid-column: 1/-1;
        height: 5px;
        background: #2a2a31;
        border-radius: 3px;
        overflow: hidden;
      }
      .bar div {
        height: 100%;
        background: #ff7a00;
        transition: width 0.2s;
      }
      .done .bar div {
        background: #22a35a;
      }
      .error .bar div {
        background: #f0524f;
      }
      .error .st {
        color: #f0524f;
      }
      .acts {
        grid-column: 1/-1;
        display: flex;
        gap: 6px;
      }
      .acts button {
        border: 1px solid #3a3a44;
        background: #202025;
        color: #ececf0;
        border-radius: 6px;
        padding: 2px 9px;
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
      }
      .acts button:hover {
        border-color: #ff7a00;
        color: #ff7a00;
      }
      [dir="rtl"] .job .n {
        direction: rtl;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hd">
        <img src="icon.png" alt="" /><span id="title">Zest</span
        ><button class="x" id="x" title="Close">✕</button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <script src="strings.js"></script>
    <script src="toast.js"></script>
  </body>
</html>
