<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob: data:;"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="sound.js"></script>
    <script>
      "use strict";

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: true });

      // Potassiumuncher macOS Lamp Curve algorithm (from Windhawk macos-minimize-animation)
      const PI = Math.PI;

      function calculateLampVertexMacOS(tx, ty, p, w, i) {
        const split = 0.3;
        const k = p <= split ? p / split : 1.0;
        const j = p > split ? (p - split) / (1.0 - split) : 0.0;

        const expandHeight = i.y - w.y - w.height;
        const fullHeight = i.y - w.y - expandHeight * (1.0 - k);
        const height = fullHeight - j * fullHeight;

        const y = ty * height;
        const x =
          tx * i.width +
          tx * (w.width - i.width) * (1.0 - j) * (1.0 - ty) +
          tx * (w.width - i.width) * (1.0 - k) * ty;

        const offsetX = (i.x - w.x) * (y / (fullHeight + 0.1)) * k + (i.x - w.x) * j;
        const offsetY = i.y - w.y - height - expandHeight * (1.0 - k);

        const effectX =
          (Math.sin(((height - y) / (fullHeight || 1)) * 2.0 * PI + PI) *
            (w.x + w.width * tx - (i.x + i.width * tx))) /
          7.0 *
          k;

        return {
          x: w.x + x + offsetX + effectX,
          y: w.y + y + offsetY,
        };
      }

      function calculateLampVertex(tx, ty, p, w, i) {
        if (i.y + i.height * 0.5 >= w.y + w.height * 0.5) {
          return calculateLampVertexMacOS(tx, ty, p, w, i);
        }
        const wm = { x: w.x, y: -(w.y + w.height), width: w.width, height: w.height };
        const im = { x: i.x, y: -(i.y + i.height), width: i.width, height: i.height };
        const res = calculateLampVertexMacOS(tx, 1.0 - ty, p, wm, im);
        return { x: res.x, y: -res.y };
      }

      // Draw textured triangle using affine transform matrix
      function drawTexturedTriangle(c, img, x0, y0, x1, y1, x2, y2, u0, v0, u1, v1, u2, v2) {
        const delta = u0 * (v1 - v2) - v0 * (u1 - u2) + (u1 * v2 - u2 * v1);
        if (Math.abs(delta) < 1e-4) return;

        c.save();
        c.beginPath();
        c.moveTo(x0, y0);
        c.lineTo(x1, y1);
        c.lineTo(x2, y2);
        c.closePath();
        c.clip();

        const a = (x0 * (v1 - v2) - v0 * (x1 - x2) + (x1 * v2 - x2 * v1)) / delta;
        const b = (u0 * (x1 - x2) - x0 * (u1 - u2) + (u1 * x2 - u2 * x1)) / delta;
        const d = (y0 * (v1 - v2) - v0 * (y1 - y2) + (y1 * v2 - y2 * v1)) / delta;
        const e = (u0 * (y1 - y2) - y0 * (u1 - u2) + (u1 * y2 - u2 * y1)) / delta;
        const at = (u0 * (v1 * x2 - v2 * x1) - v0 * (u1 * x2 - u2 * x1) + x0 * (u1 * v2 - u2 * v1)) / delta;
        const bt = (u0 * (v1 * y2 - v2 * y1) - v0 * (u1 * y2 - u2 * y1) + y0 * (u1 * v2 - u2 * v1)) / delta;

        c.transform(a, d, b, e, at, bt);
        c.drawImage(img, 0, 0);
        c.restore();
      }

      // Render realistic document / thumbnail window card
      function renderCardTexture(w, h, info, loadedImg) {
        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const octx = off.getContext("2d");

        const r = 14;
        octx.save();
        octx.beginPath();
        octx.moveTo(r, 0);
        octx.lineTo(w - r, 0);
        octx.quadraticCurveTo(w, 0, w, r);
        octx.lineTo(w, h - r);
        octx.quadraticCurveTo(w, h, w - r, h);
        octx.lineTo(r, h);
        octx.quadraticCurveTo(0, h, 0, h - r);
        octx.lineTo(0, r);
        octx.quadraticCurveTo(0, 0, r, 0);
        octx.closePath();
        octx.clip();

        // Dark obsidian window background
        const bgGrad = octx.createLinearGradient(0, 0, 0, h);
        bgGrad.addColorStop(0, "rgba(24, 24, 30, 0.98)");
        bgGrad.addColorStop(1, "rgba(14, 14, 18, 0.98)");
        octx.fillStyle = bgGrad;
        octx.fillRect(0, 0, w, h);

        // macOS Window Title Bar
        octx.fillStyle = "rgba(255, 255, 255, 0.06)";
        octx.fillRect(0, 0, w, 28);
        octx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        octx.beginPath();
        octx.moveTo(0, 28);
        octx.lineTo(w, 28);
        octx.stroke();

        // Traffic Light Dots
        const dotY = 14;
        octx.beginPath();
        octx.arc(14, dotY, 4.5, 0, Math.PI * 2);
        octx.fillStyle = "#ff5f56";
        octx.fill();

        octx.beginPath();
        octx.arc(28, dotY, 4.5, 0, Math.PI * 2);
        octx.fillStyle = "#ffbd2e";
        octx.fill();

        octx.beginPath();
        octx.arc(42, dotY, 4.5, 0, Math.PI * 2);
        octx.fillStyle = "#27c93f";
        octx.fill();

        // Window Title text
        octx.fillStyle = "#a1a1aa";
        octx.font = "600 11px system-ui, -apple-system, sans-serif";
        octx.textAlign = "center";
        octx.textBaseline = "middle";
        const title = info.name || "Document";
        octx.fillText(title.length > 28 ? title.slice(0, 26) + "…" : title, w / 2, dotY);

        // Window Body Area
        const bodyX = 14;
        const bodyY = 36;
        const bodyW = w - 28;
        const bodyH = h - 68;

        if (loadedImg && loadedImg.width > 0) {
          // Render actual image / thumbnail preview
          octx.save();
          octx.beginPath();
          octx.rect(bodyX, bodyY, bodyW, bodyH);
          octx.clip();

          // Dark inner frame
          octx.fillStyle = "rgba(0, 0, 0, 0.35)";
          octx.fillRect(bodyX, bodyY, bodyW, bodyH);

          const scale = Math.min(bodyW / loadedImg.width, bodyH / loadedImg.height);
          const dw = loadedImg.width * scale;
          const dh = loadedImg.height * scale;
          const dx = bodyX + (bodyW - dw) / 2;
          const dy = bodyY + (bodyH - dh) / 2;
          octx.drawImage(loadedImg, dx, dy, dw, dh);
          octx.restore();
        } else if (info.textSnippet) {
          // Render realistic document / code text lines (like Image 2!)
          octx.save();
          octx.beginPath();
          octx.rect(bodyX, bodyY, bodyW, bodyH);
          octx.clip();

          octx.fillStyle = "rgba(0, 0, 0, 0.4)";
          octx.fillRect(bodyX, bodyY, bodyW, bodyH);

          octx.font = '10px "Cascadia Code", Consolas, monospace';
          octx.textAlign = "left";
          octx.textBaseline = "top";

          const lines = info.textSnippet.split("\n").slice(0, 8);
          lines.forEach((line, idx) => {
            const ly = bodyY + 6 + idx * 13;
            // Line number
            octx.fillStyle = "#52525b";
            octx.fillText(String(idx + 1).padStart(2, " "), bodyX + 6, ly);
            // Text content
            octx.fillStyle = "#e4e4e7";
            octx.fillText(line.slice(0, 40), bodyX + 28, ly);
          });
          octx.restore();
        } else {
          // Large icon + format badge
          octx.font = "42px system-ui, sans-serif";
          octx.textAlign = "center";
          octx.textBaseline = "middle";
          octx.fillText(info.icon || "📄", w / 2, 78);
        }

        // Bottom status / format footer
        octx.textAlign = "left";
        octx.textBaseline = "middle";
        octx.fillStyle = "#f4f4f5";
        octx.font = "700 12px system-ui, -apple-system, sans-serif";
        const shortName = info.name || "File";
        octx.fillText(shortName.length > 22 ? shortName.slice(0, 20) + "…" : shortName, 16, h - 18);

        octx.textAlign = "right";
        octx.fillStyle = info.isOutput ? "#22c55e" : "#ff9a3d";
        octx.font = "600 11px system-ui, -apple-system, sans-serif";
        octx.fillText(info.subtitle || (info.ext || "").toUpperCase(), w - 16, h - 18);

        // Highlight border
        octx.strokeStyle = "rgba(255, 122, 0, 0.45)";
        octx.lineWidth = 1.5;
        octx.stroke();

        octx.restore();
        return off;
      }

      function loadCardTexture(w, h, info) {
        return new Promise((resolve) => {
          let resolved = false;
          const done = (img) => {
            if (resolved) return;
            resolved = true;
            resolve(renderCardTexture(w, h, info, img));
          };
          if (info.thumbnail && typeof info.thumbnail === "string") {
            const img = new Image();
            img.onload = () => done(img);
            img.onerror = () => done(null);
            setTimeout(() => done(null), 300);
            img.src = info.thumbnail;
          } else {
            done(null);
          }
        });
      }

      let animRunning = false;

      async function runGenieAnimation(opts) {
        if (animRunning) return;
        animRunning = true;

        const dpr = window.devicePixelRatio || 1;
        const cw = opts.canvasWidth || window.innerWidth || 1920;
        const ch = opts.canvasHeight || window.innerHeight || 1080;
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        ctx.resetTransform();
        ctx.scale(dpr, dpr);

        const isRising = !!opts.isRising;
        const duration = opts.duration || 540;
        const wGeom = opts.wGeom;
        const iGeom = opts.iGeom;

        const cardTexture = await loadCardTexture(wGeom.width, wGeom.height, opts.info || {});

        const xTiles = 24;
        const yTiles = 24;
        const grid = Array.from({ length: yTiles + 1 }, () => Array(xTiles + 1));

        if (isRising) {
          if (typeof ZestAudio !== "undefined") ZestAudio.pop();
        } else {
          if (typeof ZestAudio !== "undefined") ZestAudio.drop();
        }

        const startTime = performance.now();
        let animActive = true;
        let lastFrameTime = performance.now();

        function renderFrame() {
          if (!animActive) return;
          const now = performance.now();
          lastFrameTime = now;
          const elapsed = now - startTime;
          const raw_p = Math.min(elapsed / duration, 1.0);
          // Potassiumuncher Smoothstep easing: eased_p = raw_p * raw_p * (3.0 - 2.0 * raw_p)
          const eased_p = raw_p * raw_p * (3.0 - 2.0 * raw_p);
          const t = isRising ? 1.0 - eased_p : eased_p;

          let fade = 1.0;
          if (t > 0.82) fade = Math.max(0.0, (1.0 - t) / 0.18);

          ctx.clearRect(0, 0, cw, ch);

          for (let y = 0; y <= yTiles; y++) {
            for (let x = 0; x <= xTiles; x++) {
              const tx = x / xTiles;
              const ty = y / yTiles;
              grid[y][x] = calculateLampVertex(tx, ty, t, wGeom, iGeom);
            }
          }

          ctx.save();
          ctx.globalAlpha = fade;

          const sw = wGeom.width / xTiles;
          const sh = wGeom.height / yTiles;

          for (let y = 0; y < yTiles; y++) {
            for (let x = 0; x < xTiles; x++) {
              const p1 = grid[y][x];
              const p2 = grid[y][x + 1];
              const p3 = grid[y + 1][x];
              const p4 = grid[y + 1][x + 1];

              const sx = x * sw;
              const sy = y * sh;

              drawTexturedTriangle(ctx, cardTexture, p1.x, p1.y, p2.x, p2.y, p3.x, p3.y, sx, sy, sx + sw, sy, sx, sy + sh);
              drawTexturedTriangle(ctx, cardTexture, p2.x, p2.y, p4.x, p4.y, p3.x, p3.y, sx + sw, sy, sx + sw, sy + sh, sx, sy + sh);
            }
          }

          ctx.restore();

          if (raw_p < 1.0) {
            requestAnimationFrame(renderFrame);
            // Chromium background window throttle fallback: guarantee 60 FPS
            setTimeout(() => {
              if (animActive && performance.now() - lastFrameTime >= 15) {
                renderFrame();
              }
            }, 16);
          } else {
            animActive = false;
            ctx.clearRect(0, 0, cw, ch);
            animRunning = false;
            if (window.rapi) rapi.send("genie:done");
          }
        }

        renderFrame();
      }

      if (window.rapi) {
        rapi.on("genie:play", (opts) => runGenieAnimation(opts));
      }
    </script>
  </body>
</html>
