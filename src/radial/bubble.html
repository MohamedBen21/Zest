<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob: data:;"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #b {
        position: absolute;
        inset: 0;
        cursor: grab;
        transition:
          filter 0.15s,
          opacity 0.15s;
      }
      #b img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        -webkit-user-drag: none;
      }
      #b:hover {
        filter: brightness(1.12);
      }
      #b:active {
        cursor: grabbing;
      }
      #b.deny {
        outline: 3px solid #f0524f;
        outline-offset: -3px;
        border-radius: 14px;
      }
      #b.over {
        outline: 3px solid #ff7a00;
        outline-offset: -3px;
        border-radius: 14px;
      }
      #min {
        display: none;
        position: absolute;
        top: 3px;
        right: 3px;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font:
          700 13px/14px "Segoe UI",
          sans-serif;
        text-align: center;
        cursor: pointer;
      }
      #min:hover {
        background: #ff7a00;
      }
      #sz {
        display: none;
        position: absolute;
        left: 4px;
        right: 4px;
        bottom: 4px;
        gap: 2px;
      }
      #sz button {
        flex: 1;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: #2c2c33;
        box-shadow: 0 0 0 1px #45454f;
        color: #fff;
        font:
          700 10px/16px "Segoe UI",
          sans-serif;
        cursor: pointer;
      }
      #sz button:hover {
        background: #ff9a3d;
      }
      #sz button.on {
        background: #ff7a00;
      }
      #b:hover #sz {
        display: flex;
      }
      body.mini #sz {
        display: none !important;
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      #b.pop {
        animation: pop 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #b:hover #min {
        display: block;
      }
      body.mini #min {
        display: none !important;
      }
      body.mini #b {
        opacity: 0.9;
        cursor: pointer;
      }

      /* ---------------- Black Hole & Apple Genie Suck Effect ---------------- */
      #accretionDisk {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.7) rotate(0deg);
        transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        background: conic-gradient(
          from 0deg,
          transparent 0%,
          rgba(255, 122, 0, 0.85) 25%,
          rgba(168, 85, 247, 0.6) 50%,
          rgba(255, 154, 61, 0.95) 75%,
          transparent 100%
        );
        filter: blur(4px);
        z-index: 1;
      }

      #b.over #accretionDisk {
        opacity: 1;
        transform: scale(1.06) rotate(360deg);
        animation: accretionSpin 1.2s linear infinite;
      }

      @keyframes accretionSpin {
        from { transform: scale(1.06) rotate(0deg); }
        to { transform: scale(1.06) rotate(360deg); }
      }

      #singularityCore {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle, #050508 30%, #ff7a00 80%, rgba(255, 122, 0, 0) 100%);
        transform: translate(-50%, -50%) scale(0);
        pointer-events: none;
        opacity: 0;
        z-index: 3;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s;
        box-shadow: 0 0 10px rgba(255, 122, 0, 0.9), 0 0 20px rgba(168, 85, 247, 0.6);
      }

      #b.over #singularityCore {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1);
      }

      #b.over img {
        transform: scale(0.92);
        filter: brightness(1.18) contrast(1.15) drop-shadow(0 0 10px rgba(255, 122, 0, 0.8));
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s;
      }

      /* Bubble core swallow / implosion */
      @keyframes blackHoleSwallow {
        0% { transform: scale(1); filter: brightness(1); }
        25% { transform: scale(1.14) rotate(4deg); filter: brightness(1.35) drop-shadow(0 0 16px #ff7a00); }
        58% { transform: scale(0.8) rotate(-6deg); filter: brightness(1.6) drop-shadow(0 0 22px #a855f7); }
        85% { transform: scale(1.08) rotate(1deg); filter: brightness(1.15); }
        100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
      }

      #b.swallowing {
        animation: blackHoleSwallow 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* Accretion Shockwave Burst */
      #shockwave {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 3px solid #ff7a00;
        box-shadow: 0 0 16px #ff7a00, inset 0 0 8px #a855f7;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        pointer-events: none;
        z-index: 10;
      }

      #shockwave.burst {
        animation: shockwaveBurst 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }

      @keyframes shockwaveBurst {
        0% {
          transform: translate(-50%, -50%) scale(0.15);
          opacity: 1;
          border-color: #ffffff;
          box-shadow: 0 0 20px #ffffff, 0 0 35px #ff7a00;
        }
        55% {
          opacity: 0.85;
          border-color: #ff9a3d;
        }
        100% {
          transform: translate(-50%, -50%) scale(2.6);
          opacity: 0;
          border-color: #a855f7;
        }
      }

      /* Vortex stage for Apple Genie suction */
      #vortexStage {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 20;
      }

      .suck-card {
        position: absolute;
        top: 0;
        left: 0;
        width: 38px;
        height: 46px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(235, 238, 245, 0.85));
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 122, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px;
        box-sizing: border-box;
        transform-origin: 50% 100%;
        animation: appleGenieSuck 0.28s cubic-bezier(0.2, 0.85, 0.35, 1) both;
      }

      .suck-card .suck-icon {
        font-size: 14px;
        line-height: 1;
      }

      .suck-card .suck-label {
        font: 800 8.5px/10px "Segoe UI", sans-serif;
        color: #1e1e24;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Apple Genie / Black Hole Funnel Morph */
      @keyframes appleGenieSuck {
        0% {
          transform: translate(var(--start-x), var(--start-y)) scale(1) rotate(0deg);
          clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
          opacity: 1;
          filter: brightness(1) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
        }
        32% {
          /* Funnel / Genie Lamp stretch towards singularity */
          transform: translate(var(--mid-x), var(--mid-y)) scaleX(0.55) scaleY(1.9) rotate(calc(var(--angle) * 0.4));
          clip-path: polygon(12% 0%, 88% 0%, 65% 100%, 35% 100%);
          opacity: 0.95;
          filter: brightness(1.3) drop-shadow(0 0 14px #ff7a00);
        }
        68% {
          /* Extreme gravitational stretch: thin needle beam pulling into event horizon */
          transform: translate(var(--near-x), var(--near-y)) scaleX(0.2) scaleY(3.2) rotate(calc(var(--angle) * 0.9));
          clip-path: polygon(25% 0%, 75% 0%, 52% 100%, 48% 100%);
          opacity: 0.85;
          filter: brightness(1.8) drop-shadow(0 0 18px #ffa233);
        }
        90% {
          /* Slurping into the singularity point */
          transform: translate(var(--singularity-x), var(--singularity-y)) scaleX(0.06) scaleY(3.8) rotate(calc(var(--angle) * 1.35));
          clip-path: polygon(45% 0%, 55% 0%, 50% 100%, 50% 100%);
          opacity: 0.4;
          filter: brightness(2.2);
        }
        100% {
          /* Vanished into the black hole */
          transform: translate(var(--singularity-x), var(--singularity-y)) scale(0) rotate(calc(var(--angle) * 1.8));
          clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%);
          opacity: 0;
          filter: brightness(3);
        }
      }
    </style>
  </head>
  <body>
    <div id="b">
      <div id="accretionDisk"></div>
      <div id="singularityCore"></div>
      <img src="icon.png" alt="" />
      <div id="shockwave"></div>
      <div id="vortexStage"></div>
      <button
        id="min"
        title="Hide (click the tray icon or press Ctrl+Alt+B to bring it back)"
      >
        &#8211;
      </button>
      <div id="sz">
        <button data-k="S" title="Small">S</button
        ><button data-k="M" title="Medium">M</button
        ><button data-k="L" title="Large">L</button>
      </div>
    </div>
    <script src="sound.js"></script>
    <script src="strings.js"></script>
    <script src="bubble.js"></script>
  </body>
</html>
