  <!doctype html>
  <html lang="en" dir="ltr">
    <head>
      <meta charset="utf-8" />
      <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"
      />
      <title>Zest</title>
      <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
      <header class="topbar">
        <div class="brand">
          <div class="logo-wrap">
            <img class="logo" src="icon.png" alt="" />
          </div>
          <span class="name" data-i18n="appName"></span>
        </div>
        <nav class="tabs" role="tablist">
          <button
            class="tab active"
            data-tab="convert"
            role="tab"
          >
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
            <span data-i18n="tabConvert"></span>
          </button>
          <button class="tab" data-tab="image" role="tab">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/></svg>
            <span data-i18n="tabImage"></span>
          </button>
          <button class="tab" data-tab="video" role="tab">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/></svg>
            <span data-i18n="tabVideo"></span>
          </button>
          <button class="tab" data-tab="tools" role="tab">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            <span data-i18n="tabTools"></span>
          </button>
        </nav>
        <div class="right">
          <label class="out"
            ><span data-i18n="output"></span>
            <select id="outMode">
              <option value="same" data-i18n="outSame"></option>
              <option value="folder" data-i18n="outFolder"></option>
            </select>
          </label>
          <button id="outPick" class="ghost small" title=""></button>
          <button id="wheelBtn" class="ghost small" data-i18n="wheelBtn"></button>
          <div class="lang">
            <button data-lang="en">EN</button><button data-lang="ar">عربي</button>
          </div>
        </div>
      </header>

      <main>
        <!-- CONVERT -->
        <section id="tab-convert" class="page active">
          <div id="drop" class="drop big" tabindex="0">
            <div class="drop-illustration">
              <svg class="cloud-icon" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="28" class="drop-ring-glow" />
                <path d="M20 38C16.686 38 14 35.314 14 32C14 28.94 16.282 26.417 19.238 26.046C20.126 20.355 25.042 16 31 16C37.498 16 42.84 21.037 43.187 27.42C46.993 27.973 50 31.258 50 35.25C50 39.53 46.53 43 42.25 43H22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="cloud-path" />
                <path d="M32 26V45M32 26L25 33M32 26L39 33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-path" />
              </svg>
            </div>
            <div class="drop-title" data-i18n="dropTitle"></div>
            <div class="drop-sub" data-i18n="dropSub"></div>
            <div class="drop-pills">
              <span class="dpill dpill-img">🖼️ Images</span>
              <span class="dpill dpill-vid">🎬 Videos</span>
              <span class="dpill dpill-aud">🎧 Audio</span>
              <span class="dpill dpill-pdf">📕 PDFs</span>
              <span class="dpill dpill-doc">📄 Docs</span>
              <span class="dpill dpill-fb">📖 Flipbooks</span>
            </div>
          </div>
          <div id="convertArea" class="hidden">
            <div class="row between">
              <div class="row">
                <button id="addMore" class="ghost" data-i18n="addMore"></button
                ><button id="clearFiles" class="ghost" data-i18n="clear"></button>
              </div>
              <details class="opts">
                <summary data-i18n="options"></summary>
                <div class="grid2">
                  <label
                    ><span data-i18n="imgQuality"></span>
                    <output id="cvQv">85</output
                    ><input
                      id="cvQuality"
                      type="range"
                      min="1"
                      max="100"
                      value="85"
                  /></label>
                  <label
                    ><span data-i18n="videoCrf"></span>
                    <output id="cvCv">23</output
                    ><input id="cvCrf" type="range" min="16" max="40" value="23"
                  /></label>
                  <label
                    ><span data-i18n="audioBitrate"></span
                    ><select id="cvAbr">
                      <option>96</option>
                      <option>128</option>
                      <option selected>192</option>
                      <option>256</option>
                      <option>320</option>
                    </select></label
                  >
                  <label
                    ><span data-i18n="pdfDpi"></span
                    ><input
                      id="cvDpi"
                      type="number"
                      value="150"
                      min="36"
                      max="600"
                  /></label>
                  <label class="chk"
                    ><input id="cvKeepMeta" type="checkbox" />
                    <span data-i18n="keepMeta"></span
                  ></label>
                </div>
              </details>
            </div>
            <div id="fileChips" class="chips"></div>
            <div id="targetGroups"></div>
          </div>
          <details class="supported">
            <summary data-i18n="supported"></summary>
            <div id="supportedList"></div>
          </details>
        </section>

        <!-- IMAGE STUDIO -->
        <section id="tab-image" class="page studio">
          <aside class="side list">
            <div class="drop mini" id="imgDrop">
              <span data-i18n="studioEmpty"></span>
            </div>
            <button
              class="ghost small"
              id="imgUseConvert"
              data-i18n="useConvertFiles"
            ></button>
            <div id="imgList" class="thumbs"></div>
          </aside>
          <div class="stage-wrap">
            <div class="stage-bar">
              <span id="imgInfo" class="muted"></span>
              <span class="row"
                ><button
                  id="imgCropBtn"
                  class="ghost small"
                  data-i18n="editCrop"
                ></button
                ><button
                  id="imgCropClear"
                  class="ghost small"
                  data-i18n="clearCrop"
                ></button>
                <select id="imgCropAspect" class="small">
                  <option value="" data-i18n="free"></option>
                  <option value="1">1:1</option>
                  <option value="1.3333">4:3</option>
                  <option value="1.7778">16:9</option>
                  <option value="0.8">4:5</option>
                  <option value="0.5625">9:16</option>
                </select>
                <button
                  id="imgBefore"
                  class="ghost small"
                  data-i18n="original"
                ></button
              ></span>
            </div>
            <div class="stage" id="imgStage">
              <div class="canvas" id="imgCanvas">
                <img id="imgView" alt="" />
                <div class="crop-layer hidden" id="imgCrop"></div>
              </div>
              <div class="spinner hidden" id="imgSpin"></div>
            </div>
          </div>
          <aside class="side panel" id="imgPanel">
            <fieldset>
              <legend data-i18n="resize"></legend>
              <div class="seg" id="imgResizeMode">
                <button data-v="none" data-i18n="none" class="on"></button
                ><button data-v="px" data-i18n="pixels"></button
                ><button data-v="percent" data-i18n="percent"></button>
              </div>
              <div class="grid2 rz-px">
                <label
                  ><span data-i18n="width"></span
                  ><input type="number" id="imgW" min="1" /></label
                ><label
                  ><span data-i18n="height"></span
                  ><input type="number" id="imgH" min="1"
                /></label>
              </div>
              <label class="rz-pc"
                ><span data-i18n="percent"></span>
                <output id="imgPcV">50</output>%<input
                  type="range"
                  id="imgPc"
                  min="1"
                  max="400"
                  value="50"
              /></label>
              <label class="chk rz-px"
                ><input type="checkbox" id="imgKeep" checked />
                <span data-i18n="keepAspect"></span
              ></label>
              <label class="rz-px"
                ><span data-i18n="fit"></span
                ><select id="imgFit">
                  <option value="inside" data-i18n="fit_inside"></option>
                  <option value="cover" data-i18n="fit_cover"></option>
                  <option
                    value="contain"
                    data-i18n="fit_contain"
                  ></option></select
              ></label>
            </fieldset>
            <fieldset>
              <legend data-i18n="rotateFlip"></legend>
              <div class="row wrap">
                <button class="ghost small" id="imgRotL" data-i18n="rotL"></button
                ><button
                  class="ghost small"
                  id="imgRotR"
                  data-i18n="rotR"
                ></button
                ><button
                  class="ghost small"
                  id="imgRot180"
                  data-i18n="rot180"
                ></button>
              </div>
              <label
                ><span data-i18n="angle"></span>
                <output id="imgAngV">0</output>°<input
                  type="range"
                  id="imgAng"
                  min="-180"
                  max="180"
                  value="0"
              /></label>
              <div class="row wrap">
                <label class="chk"
                  ><input type="checkbox" id="imgFlipH" />
                  <span data-i18n="flipH"></span></label
                ><label class="chk"
                  ><input type="checkbox" id="imgFlipV" />
                  <span data-i18n="flipV"></span
                ></label>
              </div>
            </fieldset>
            <fieldset>
              <legend data-i18n="adjust"></legend>
              <label
                ><span data-i18n="brightness"></span> <output>0</output
                ><input
                  type="range"
                  data-adj="brightness"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label
                ><span data-i18n="contrast"></span> <output>0</output
                ><input
                  type="range"
                  data-adj="contrast"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label
                ><span data-i18n="saturation"></span> <output>0</output
                ><input
                  type="range"
                  data-adj="saturation"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label
                ><span data-i18n="hue"></span> <output>0</output
                ><input type="range" data-adj="hue" min="0" max="359" value="0"
              /></label>
              <label
                ><span data-i18n="blur"></span> <output>0</output
                ><input
                  type="range"
                  data-adj="blur"
                  min="0"
                  max="20"
                  step="0.5"
                  value="0"
              /></label>
              <div class="row wrap">
                <label class="chk"
                  ><input type="checkbox" id="imgGray" />
                  <span data-i18n="grayscale"></span></label
                ><label class="chk"
                  ><input type="checkbox" id="imgInv" />
                  <span data-i18n="invert"></span></label
                ><label class="chk"
                  ><input type="checkbox" id="imgSharp" />
                  <span data-i18n="sharpen"></span
                ></label>
              </div>
            </fieldset>
            <fieldset>
              <legend data-i18n="removeBg"></legend>
              <label class="chk"
                ><input type="checkbox" id="imgBg" />
                <span data-i18n="removeBg"></span
              ></label>
              <label
                ><span data-i18n="tolerance"></span>
                <output id="imgTolV">25</output
                ><input type="range" id="imgTol" min="1" max="100" value="25"
              /></label>
              <label
                ><span data-i18n="bgColor"></span
                ><input type="text" id="imgBgColor" placeholder="#ffffff"
              /></label>
              <p class="note" data-i18n="removeBgNote"></p>
            </fieldset>
            <fieldset>
              <legend data-i18n="outputFmt"></legend>
              <label
                ><span data-i18n="format"></span
                ><select id="imgFmt">
                  <option>jpg</option>
                  <option>png</option>
                  <option>webp</option>
                  <option>avif</option>
                  <option>tiff</option>
                  <option>gif</option>
                  <option>bmp</option>
                  <option>ico</option>
                  <option>pdf</option>
                </select></label
              >
              <label
                ><span data-i18n="quality"></span> <output id="imgQV">85</output
                ><input type="range" id="imgQ" min="1" max="100" value="85"
              /></label>
              <div class="grid2">
                <label
                  ><span data-i18n="targetKB"></span
                  ><input
                    type="number"
                    id="imgKB"
                    min="1"
                    placeholder="—" /></label
                ><label
                  ><span data-i18n="dpi"></span
                  ><input
                    type="number"
                    id="imgDpi"
                    min="1"
                    max="2400"
                    placeholder="—"
                /></label>
              </div>
              <label class="chk"
                ><input type="checkbox" id="imgStrip" checked />
                <span data-i18n="stripMeta"></span
              ></label>
            </fieldset>
            <div class="actions">
              <button class="ghost" id="imgReset" data-i18n="reset"></button
              ><button class="ghost" id="imgOne" data-i18n="applyCurrent"></button
              ><button class="primary" id="imgAll" data-i18n="applyAll"></button>
            </div>
          </aside>
        </section>

        <!-- VIDEO STUDIO -->
        <section id="tab-video" class="page studio">
          <aside class="side list">
            <div class="drop mini" id="vidDrop">
              <span data-i18n="videoEmpty"></span>
            </div>
            <button
              class="ghost small"
              id="vidUseConvert"
              data-i18n="useConvertFiles"
            ></button>
            <div id="vidList" class="vlist"></div>
          </aside>
          <div class="stage-wrap">
            <div class="stage-bar">
              <span id="vidInfo" class="muted"></span>
              <span class="row"
                ><button
                  id="vidCropBtn"
                  class="ghost small"
                  data-i18n="editCrop"
                ></button
                ><button
                  id="vidCropClear"
                  class="ghost small"
                  data-i18n="clearCrop"
                ></button>
                <select id="vidCropAspect" class="small">
                  <option value="" data-i18n="free"></option>
                  <option value="1">1:1</option>
                  <option value="1.7778">16:9</option>
                  <option value="0.5625">9:16</option>
                  <option value="1.3333">4:3</option>
                  <option value="0.8">4:5</option>
                </select>
                <label class="chk small"
                  ><input type="checkbox" id="vidProcessed" />
                  <span data-i18n="processedFrame"></span></label
              ></span>
            </div>
            <div class="stage" id="vidStage">
              <div class="canvas" id="vidCanvas">
                <video id="vidView" preload="metadata"></video
                ><img id="vidFrame" class="hidden" alt="" />
                <div class="crop-layer hidden" id="vidCrop"></div>
              </div>
              <div class="spinner hidden" id="vidSpin"></div>
            </div>
            <div class="timeline">
              <button id="vidPlay" class="ghost small">▶</button>
              <div class="track" id="vidTrack">
                <div class="sel" id="vidSel"></div>
                <div class="head" id="vidHead"></div>
              </div>
              <span id="vidTime" class="mono">0:00.0</span>
            </div>
            <div class="row trimrow">
              <button
                class="ghost small"
                id="vidSetStart"
                data-i18n="setStart"
              ></button>
              <label class="inline"
                ><span data-i18n="start"></span
                ><input id="vidStart" class="mono" value="0:00.0"
              /></label>
              <label class="inline"
                ><span data-i18n="end"></span
                ><input id="vidEnd" class="mono" value=""
              /></label>
              <button
                class="ghost small"
                id="vidSetEnd"
                data-i18n="setEnd"
              ></button>
              <span class="muted"
                ><span data-i18n="duration"></span>: <b id="vidLen">–</b></span
              >
              <p id="vidNote" class="note hidden" data-i18n="notPlayable"></p>
            </div>
          </div>
          <aside class="side panel" id="vidPanel">
            <fieldset>
              <legend data-i18n="outputFmt"></legend>
              <label
                ><span data-i18n="format"></span
                ><select id="vidFmt">
                  <optgroup label="Video">
                    <option>mp4</option>
                    <option>webm</option>
                    <option>mkv</option>
                    <option>mov</option>
                    <option>avi</option>
                    <option>m4v</option>
                    <option>wmv</option>
                    <option>flv</option>
                    <option>mpg</option>
                    <option>ts</option>
                    <option>ogv</option>
                    <option>3gp</option>
                  </optgroup>
                  <optgroup label="Animated">
                    <option>gif</option>
                    <option>webp</option>
                  </optgroup>
                  <optgroup label="Audio">
                    <option>mp3</option>
                    <option>m4a</option>
                    <option>wav</option>
                    <option>flac</option>
                    <option>ogg</option>
                    <option>opus</option>
                    <option>aac</option>
                  </optgroup>
                  <optgroup label="Still">
                    <option value="png">png (frame)</option>
                    <option value="jpg">jpg (frame)</option>
                  </optgroup>
                </select></label
              >
            </fieldset>
            <fieldset class="v-only">
              <legend data-i18n="resolution"></legend>
              <select id="vidRes">
                <option value="" data-i18n="resOriginal"></option>
                <option value="2160">2160p (4K)</option>
                <option value="1440">1440p</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
                <option value="480">480p</option>
                <option value="360">360p</option>
                <option value="240">240p</option>
                <option value="custom" data-i18n="custom"></option>
              </select>
              <div class="grid2 hidden" id="vidCustom">
                <label
                  ><span data-i18n="width"></span
                  ><input type="number" id="vidW" min="16" /></label
                ><label
                  ><span data-i18n="height"></span
                  ><input type="number" id="vidH" min="16"
                /></label>
              </div>
              <label
                ><span data-i18n="fps"></span
                ><select id="vidFps">
                  <option value="" data-i18n="fpsOriginal"></option>
                  <option>12</option>
                  <option>15</option>
                  <option>24</option>
                  <option>25</option>
                  <option>30</option>
                  <option>50</option>
                  <option>60</option>
                </select></label
              >
            </fieldset>
            <fieldset class="v-only enc-only">
              <legend data-i18n="rate"></legend>
              <div class="seg" id="vidRate">
                <button data-v="crf" class="on" data-i18n="rate_crf"></button
                ><button data-v="bitrate" data-i18n="rate_bitrate"></button
                ><button data-v="size" data-i18n="rate_size"></button>
              </div>
              <label class="r-crf"
                ><span>CRF</span> <output id="vidCrfV">23</output
                ><input type="range" id="vidCrf" min="14" max="42" value="23"
              /></label>
              <label class="r-bitrate hidden"
                ><span data-i18n="videoBitrate"></span
                ><input type="number" id="vidBr" value="2500" min="50"
              /></label>
              <label class="r-size hidden"
                ><span data-i18n="targetMB"></span
                ><input type="number" id="vidMB" value="25" min="0.1" step="0.5"
              /></label>
              <div class="muted">
                <span data-i18n="estimate"></span>: <b id="vidEst">–</b>
              </div>
            </fieldset>
            <fieldset class="gif-only hidden">
              <legend>GIF / WebP</legend>
              <div class="grid2">
                <label
                  ><span data-i18n="gifFps"></span
                  ><input
                    type="number"
                    id="vidGifFps"
                    value="12"
                    min="1"
                    max="50" /></label
                ><label
                  ><span data-i18n="gifWidth"></span
                  ><input type="number" id="vidGifW" value="480" min="32"
                /></label>
              </div>
            </fieldset>
            <fieldset class="v-only">
              <legend data-i18n="rotateFlip"></legend>
              <div class="seg" id="vidRot">
                <button data-v="0" class="on">0°</button
                ><button data-v="90">90°</button><button data-v="180">180°</button
                ><button data-v="270">270°</button>
              </div>
              <div class="row wrap">
                <label class="chk"
                  ><input type="checkbox" id="vidFlipH" />
                  <span data-i18n="flipH"></span></label
                ><label class="chk"
                  ><input type="checkbox" id="vidFlipV" />
                  <span data-i18n="flipV"></span
                ></label>
              </div>
            </fieldset>
            <fieldset class="v-only">
              <legend data-i18n="adjust"></legend>
              <label
                ><span data-i18n="brightness"></span> <output>0</output
                ><input
                  type="range"
                  data-vadj="brightness"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label
                ><span data-i18n="contrast"></span> <output>0</output
                ><input
                  type="range"
                  data-vadj="contrast"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label
                ><span data-i18n="saturation"></span> <output>0</output
                ><input
                  type="range"
                  data-vadj="saturation"
                  min="-100"
                  max="100"
                  value="0"
              /></label>
              <label class="chk"
                ><input type="checkbox" id="vidGray" />
                <span data-i18n="grayscale"></span
              ></label>
            </fieldset>
            <fieldset>
              <legend data-i18n="audio"></legend>
              <label
                ><span data-i18n="audioBitrate"></span
                ><select id="vidAbr">
                  <option>64</option>
                  <option>96</option>
                  <option selected>128</option>
                  <option>160</option>
                  <option>192</option>
                  <option>256</option>
                  <option>320</option>
                </select></label
              >
              <div class="row wrap">
                <label class="chk v-only"
                  ><input type="checkbox" id="vidMute" />
                  <span data-i18n="mute"></span></label
                ><label class="chk"
                  ><input type="checkbox" id="vidNorm" />
                  <span data-i18n="normalize"></span
                ></label>
              </div>
              <label
                ><span data-i18n="speed"></span
                ><select id="vidSpeed">
                  <option>0.25</option>
                  <option>0.5</option>
                  <option>0.75</option>
                  <option selected>1</option>
                  <option>1.25</option>
                  <option>1.5</option>
                  <option>2</option>
                  <option>4</option>
                </select></label
              >
              <label class="chk"
                ><input type="checkbox" id="vidStrip" />
                <span data-i18n="stripMeta"></span
              ></label>
            </fieldset>
            <div class="actions">
              <button class="ghost" id="vidReset" data-i18n="reset"></button
              ><button class="ghost" id="vidOne" data-i18n="applyCurrent"></button
              ><button class="primary" id="vidAll" data-i18n="applyAll"></button>
            </div>
          </aside>
        </section>

        <!-- TOOLS -->
        <section id="tab-tools" class="page tools">
          <aside class="toolgrid-sidebar">
            <div class="tool-search-wrap">
              <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
              <input type="search" id="toolSearch" class="tool-search" placeholder="Search 31 batch tools..." autocomplete="off" />
            </div>
            <div class="tool-filters" id="toolFilters">
              <button type="button" class="tf-btn on" data-filter="all">All</button>
              <button type="button" class="tf-btn" data-filter="pdf">PDF</button>
              <button type="button" class="tf-btn" data-filter="video">Video</button>
              <button type="button" class="tf-btn" data-filter="image">Image</button>
              <button type="button" class="tf-btn" data-filter="audio">Audio</button>
            </div>
            <div class="toolgrid" id="toolGrid"></div>
          </aside>
          <div class="toolpane" id="toolPane">
            <div class="empty" data-i18n="pickTool"></div>
          </div>
        </section>
      </main>

      <footer id="queue" class="queue collapsed">
        <div class="qhead">
          <button id="qToggle" class="ghost small">▴</button
          ><b data-i18n="queue"></b> <span id="qCount" class="badge">0</span>
          <div class="qbar"><div id="qTotal"></div></div>
          <button id="qOpen" class="ghost small" data-i18n="openFolder"></button
          ><button id="qClear" class="ghost small" data-i18n="clearDone"></button>
        </div>
        <div id="qList" class="qlist">
          <div class="empty" data-i18n="emptyQueue"></div>
        </div>
      </footer>
      <div id="wheelPop" class="wheelpop hidden">
        <b data-i18n="wheelTitle"></b>
        <p class="muted small" data-i18n="wheelHelp"></p>
        <label class="chk"
          ><input type="checkbox" id="wpBubble" />
          <span data-i18n="wheelBubble"></span
        ></label>
        <label class="chk"
          ><input type="checkbox" id="wpHotkey" />
          <span data-i18n="wheelHotkey"></span
        ></label>
        <label class="chk"
          ><input type="checkbox" id="wpLogin" />
          <span data-i18n="wheelLogin"></span
        ></label>
        <label class="chk"
          ><input type="checkbox" id="wpSound" checked />
          <span data-i18n="wheelSound"></span>
        </label>
        <p class="muted small" data-i18n="wheelWin11"></p>
      </div>
      <div id="toast" class="toast hidden"></div>
      <script src="sound.js"></script>
      <script src="i18n.js"></script>
      <script src="app.js"></script>
    </body>
  </html>
